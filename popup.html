<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>KookTube</title>
<style>
  body{margin:0;padding:12px 14px;min-width:230px;background:#141414;color:#f5f5f5;
    font:13px/1.35 Roboto,Arial,sans-serif}
  h1{margin:0 0 10px;font-size:13px;font-weight:600}
  label{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:0 0 8px;cursor:pointer}
  label.disabled{color:#7a7a7a;cursor:default}
  [hidden]{display:none !important}
  input{width:16px;height:16px;margin:0;accent-color:#8ec5ff}
  #site-name{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:160px}
  p{margin:4px 0 0;font-size:11px;color:#9a9a9a}
</style>
</head>
<body>
<h1>KookTube Key Detector</h1>
<label id="global-row">
  <span>On everywhere</span>
  <input type="checkbox" id="global">
</label>
<label id="site-row" class="disabled">
  <span>On for <span id="site-name">this site</span></span>
  <input type="checkbox" id="site" disabled>
</label>
<p id="note"></p>
<script src="popup.js"></script>
</body>
</html>
